[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logpulse"
version = "0.1.0"
description = "Streaming log analytics: windowed metrics, streaming quantiles, heavy hitters and anomaly alerts for nginx and JSON logs."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ahmed Mahdy", email = "mahdy@progma.tech" }]
requires-python = ">=3.11"
keywords = ["logs", "observability", "streaming", "t-digest", "count-min-sketch", "anomaly-detection"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27", "fastapi>=0.110"]

[project.scripts]
logpulse = "logpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT"]
# The code base also runs on Python 3.9 for local testing, so keep idioms that work there:
# datetime.timezone.utc instead of datetime.UTC, and zip() without strict=.
ignore = ["UP017", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["logpulse"]
